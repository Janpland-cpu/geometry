<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="一个轻量、可扩展的数学习题集网站。">
  <title>数学习题集</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="home">
  <header class="site-header">
    <div class="shell nav-row">
      <a class="brand" href="index.html" aria-label="返回首页">
        <span class="brand-mark">∠</span>
        <span>
          <strong>数学习题集</strong>
          <small>Math Exercise Book</small>
        </span>
      </a>
      <nav class="top-nav" aria-label="主导航">
        <a class="active" href="index.html">习题</a>
        <a href="about.html">说明</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero shell">
      <div>
        <p class="eyebrow">STATIC</p>
        <h1>把每一道值得复习的题，整理成可反复打开的解题卡片。</h1>
        <p class="hero-copy">按题型、标签和难度管理；一道题可以保留多种解法，并附交互演示。</p>
      </div>
      <div class="hero-stats" aria-label="习题统计">
        <div class="stat"><strong id="problemCount">0</strong><span>道习题</span></div>
        <div class="stat"><strong id="solutionCount">0</strong><span>个解法</span></div>
        <div class="stat"><strong id="masteredCount">0</strong><span>已掌握</span></div>
      </div>
    </section>

    <section class="catalog shell" aria-labelledby="catalogTitle">
      <div class="catalog-head">
        <div>
          <p class="section-kicker">EXERCISES</p>
          <h2 id="catalogTitle">习题目录</h2>
        </div>
        <div class="catalog-tools">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜索题目、标签、编号…" autocomplete="off">
          </label>
        </div>
      </div>
      <div id="tagFilters" class="filter-row" aria-label="标签筛选"></div>
      <div id="problemGrid" class="problem-grid"></div>
      <p id="emptyState" class="empty-state" hidden>没有符合条件的习题。</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-row">
      <span>静态习题集</span>
    </div>
  </footer>

  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
